name: Verify banking and automation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CREDITFLOW_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CREDITFLOW_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Evidence gate behavior tests
        run: python3 -m unittest infrastructure/test_evidence_run.py -v
      - name: Private unit, PostgreSQL, Cucumber and TestNG evidence
        run: node infrastructure/verify.cjs
      - name: Independent public-mode Cucumber and TestNG evidence
        run: node infrastructure/public-verify.cjs
      - name: Full inventory, OSV, Gitleaks and configuration checks
        run: node infrastructure/quality-verify.cjs
      - name: Reject stale or incomplete core/public/quality evidence
        run: python3 infrastructure/verify-evidence.py --scope core --scope public --scope quality
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: creditflow-core-${{ github.sha }}
          path: |
            .work/evidence/runs/
            .work/evidence/latest/
          retention-days: 14
          include-hidden-files: true
      - name: Stop this project stack
        if: always()
        run: python3 infrastructure/evidence-run.py cleanup
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CREDITFLOW_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CREDITFLOW_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Web contracts, build, types and full npm audit
        run: node infrastructure/web-verify.cjs --container-web
      - name: Selenium, Playwright, BFF and Bruno evidence
        run: node infrastructure/ui-verify.cjs
      - name: Reject stale or incomplete browser/web evidence
        run: python3 infrastructure/verify-evidence.py --scope browser --scope web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: creditflow-browser-${{ github.sha }}
          path: |
            .work/evidence/runs/
            .work/evidence/latest/
          retention-days: 14
          include-hidden-files: true
      - name: Stop this project stack
        if: always()
        run: python3 infrastructure/evidence-run.py cleanup
